services:
  server:
    build:
      context: .
    image: ghcr.io/ismola/asismetro-automations:main
    init: true
    shm_size: "512m"
    ports:
      - 3000:3000
      - 127.0.0.1:${METRICS_PORT:-9090}:9090
    container_name: asismetro-automations
    volumes:
      - ./temp_downloads:/app/temp_downloads
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - STAGE=${STAGE:-staging}
      - VALID_TOKEN=${VALID_TOKEN:-sample}
      - HEADLESS_MODE=${HEADLESS_MODE:-auto}
      - SELENIUM_STEALTH=${SELENIUM_STEALTH:-true}
      - SELENIUM_FORCE_INTERACTABLE=${SELENIUM_FORCE_INTERACTABLE:-true}
      - BROWSER_LANGUAGE=${BROWSER_LANGUAGE:-es}
      - DOWNLOAD_DIR=${DOWNLOAD_DIR:-temp_downloads}
      - PAGE_MAX_TIMEOUT=${PAGE_MAX_TIMEOUT:-7}
      - WEBDRIVER_COMMAND_TIMEOUT=${WEBDRIVER_COMMAND_TIMEOUT:-120}
      - PAGE_LOAD_TIMEOUT=${PAGE_LOAD_TIMEOUT:-120}
      - SCRIPT_TIMEOUT=${SCRIPT_TIMEOUT:-60}
      - WEBDRIVER_MAX_LIFETIME=${WEBDRIVER_MAX_LIFETIME:-1800}
      - GUNICORN_MAX_REQUESTS=${GUNICORN_MAX_REQUESTS:-100}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-1800}
      - BASE_URL=${BASE_URL:-https://asismetro.org/}
      - METRICS_PORT=9090
      - SCRAPER_SERVICE_NAME=${SCRAPER_SERVICE_NAME:-asismetro-automations}
      - MAX_CONTENT_LENGTH=${MAX_CONTENT_LENGTH:-10485760}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9090/-/healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    develop:
      watch:
        - action: sync
          path: .
          target: /app
        - action: rebuild
          path: requirements.txt
