name: Test
on:
  workflow_call:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          STAGE: staging
          VALID_TOKEN: sample
          SCRAPER_SERVICE_NAME: asismetro-automations
      - run: docker build --pull -t asismetro-automations:test .
      - name: Test container and browser cleanup
        run: |
          docker run -d --init --name asismetro-automations-test --shm-size=512m \
            -e STAGE=staging -e VALID_TOKEN=sample \
            -e SCRAPER_SERVICE_NAME=asismetro-automations \
            -e 'BASE_URL=data:text/html,<title>ok</title>' \
            asismetro-automations:test
          docker exec -i asismetro-automations-test python - <<'PYTEST'
          import time
          import urllib.request

          for _ in range(60):
              try:
                  response = urllib.request.urlopen('http://127.0.0.1:3000/', timeout=2)
                  assert response.read() == b'asismetro-automations'
                  assert response.headers['X-Run-ID']
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise AssertionError('API did not start')

          assert urllib.request.urlopen('http://127.0.0.1:9090/-/healthy', timeout=2).status == 200

          from selenium_scraper_runtime.browser import close_driver, get_page
          for browser in ('chrome', 'firefox'):
              driver = get_page(browser, url='data:text/html,<title>ok</title>')
              try:
                  assert driver.title == 'ok'
              finally:
                  close_driver(driver)

          import psutil
          import subprocess
          import sys

          time.sleep(2)
          browser_names = ('chromium', 'chrome', 'firefox', 'gecko')
          remaining = [p for p in psutil.process_iter(['name'])
                       if p.info['name'] and any(name in p.info['name'] for name in browser_names)]
          assert not remaining

          owner = subprocess.Popen(
              [sys.executable, '-c',
               "import time; from selenium_scraper_runtime.browser import get_page; "
               "get_page('chrome', url='data:text/html,<title>ok</title>'); "
               "print('ready', flush=True); time.sleep(60)"],
              stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
          )
          assert owner.stdout.readline().strip() == 'ready'
          owner.kill()
          owner.wait(timeout=5)
          for _ in range(20):
              remaining = [p for p in psutil.process_iter(['name'])
                           if p.info['name'] and any(name in p.info['name'] for name in browser_names)]
              if not remaining:
                  break
              time.sleep(0.5)
          else:
              raise AssertionError(f'orphan browser processes: {remaining}')
          PYTEST
        shell: bash
      - if: always()
        run: docker logs asismetro-automations-test 2>/dev/null || true; docker rm -f asismetro-automations-test 2>/dev/null || true
